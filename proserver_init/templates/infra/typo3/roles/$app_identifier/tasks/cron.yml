---
- name: Set the TYPO3 context env variable
  ansible.builtin.cron:
    name: TYPO3_CONTEXT
    env: yes
    job: "{{ app.context }}"
    user: proserver

- name: Install the TYPO3 scheduler cronjob
  ansible.builtin.cron:
    name: Run TYPO3 scheduler
    hour: "*"
    minute: "*"
    job: "/usr/local/bin/php {{ vars.app.prefix.current_release }}/vendor/bin/typo3 scheduler:run"
    user: proserver
    disabled: true
